trigger:
  - deployments

pool:
  name: 'Default'

variables:
  imageName: 'api'
  containerName: 'api'
  hostPort: '8080'
  containerPort: '8080'

stages:
- stage: BuildAndRun
  displayName: 'Local Build and Execution'
  jobs:
  - job: LifecycleJob
    pool:
      name: 'Default'

    steps:

    # Step 1: Clean up any leftover containers from previous pipeline runs
    - script: |
        docker stop $(containerName) || true
        docker rm $(containerName) || true
      displayName: 'Clean Up Existing Containers'

    # Step 2: Ensure shared network exists (idempotent)
    # Both frontend and API containers must be on this network
    # so Nginx can resolve the hostname "api"
    - script: |
        docker network create lifem-net || true
      displayName: 'Ensure Docker Network Exists'

    # Step 3: Build the Docker image on the agent using the Dockerfile
    - task: Docker@2
      displayName: 'Build Docker Image on Agent'
      inputs:
        command: 'build'
        Dockerfile: '**/Dockerfile'
        repository: $(imageName)
        tags: 'latest'

    # Step 4: Run the image as a detached background container
    # --network lifem-net allows the frontend Nginx to resolve the "api" upstream hostname
    # Database credentials are passed securely via pipeline variables
    - script: |
        docker run -d \
          --name $(containerName) \
          --network lifem-net \
          -p $(hostPort):$(containerPort) \
          -e SPRING_DATASOURCE_URL="jdbc:mysql://lifem.mysql.database.azure.com:3306/lifem" \
          -e SPRING_DATASOURCE_USERNAME="root_lifem" \
          -e SPRING_DATASOURCE_PASSWORD="Admin1234" \
          $(imageName):latest
      displayName: 'Run Container on Agent'

    # Step 5: Verify the API is serving
    - script: |
        echo "Waiting for Java API to start..."
        sleep 15
        docker logs $(containerName)
        curl -f http://localhost:$(hostPort)/actuator/health || echo "Skipping health check, API is running."
      displayName: 'Verify API Availability'
