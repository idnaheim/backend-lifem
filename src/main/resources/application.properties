spring.application.name=lifem

# Database Configuration
spring.datasource.url = jdbc:mysql://localhost:3306/lifem_test?useLegacyDatetimeCode=false&serverTimezone=Asia/Manila&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username = root
spring.datasource.password = Admin1234
spring.datasource.driver-class-name= com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = false

# Encryption Configuration
encryption.password=idnaheim
encryption.salt=bc4ec87caf751f440668f85f0b406126c2806a1ed44e1efe46bfbb5ef8a70b24

# Server Configuration
server.port=8080
application.timezone=GMT+08:00

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Cache TTL (minutes)
cache.expenses.ttl-minutes=5
cache.incomes.ttl-minutes=5

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
kafka.topic.transactions=lifem.transactions
